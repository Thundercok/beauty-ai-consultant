[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beauty-ai-consultant"
version = "0.2.0"
description = "Optical skin colorimetry, illumination-invariant chromophore analysis, and Kubelka-Munk K-beauty consultation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
vision = [
    "mediapipe==0.10.14",
]
research = [
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
]

[project.scripts]
beauty-ai = "beauty_ai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beauty_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
